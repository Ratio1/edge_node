name: Fetch vulndb
description: >
  Download the pinned redmesh-vulndb release, verify it, and place it at the fixed
  path in the workspace. Never fails the build: with no pin.json, or on any fetch or
  verification error, it emits a warning and the image ships without the database
  (the node then uses the static catalog and reports vulndb_load_error).
runs:
  using: composite
  steps:
    - name: Read pin
      id: pin
      shell: bash
      run: |
        set -uo pipefail
        pin=extensions/business/cybersec/red_mesh/vulndb/pin.json
        if [ ! -f "$pin" ]; then
          echo "No pin.json: skipping vulndb fetch (image falls back to static catalog)"
          echo "::warning title=vulndb::No pin.json: this image uses the static CVE catalog"
          echo "present=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! fields=$(python3 "${GITHUB_ACTION_PATH}/verify_vulndb.py" pin "$pin"); then
          echo "::warning title=vulndb::Invalid pin.json: this image uses the static CVE catalog"
          echo "present=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "present=true" >> "$GITHUB_OUTPUT"
        echo "$fields" >> "$GITHUB_OUTPUT"

    - name: Download, verify and install
      if: steps.pin.outputs.present == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_ID: ${{ steps.pin.outputs.build_id }}
        ASSET: ${{ steps.pin.outputs.asset }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
        SIZE_ZST: ${{ steps.pin.outputs.size_zst }}
        SIZE: ${{ steps.pin.outputs.size }}
      run: |
        db=extensions/business/cybersec/red_mesh/vulndb/vulndb.sqlite
        # The checks run in a child shell so `set -e` holds inside it; any failure is a warning, never a failed build.
        if ! bash -euo pipefail <<'CHECKS'
        mkdir -p "$RUNNER_TEMP/vulndb"
        curl --fail --silent --show-error --location --retry 3 \
          -o "$RUNNER_TEMP/vulndb/$ASSET" \
          "https://github.com/Ratio1/redmesh-vulndb/releases/download/${BUILD_ID}/${ASSET}"
        [ "$(stat -c %s "$RUNNER_TEMP/vulndb/$ASSET")" = "$SIZE_ZST" ] || { echo "size_zst mismatch" >&2; exit 1; }
        echo "${SHA256}  $RUNNER_TEMP/vulndb/$ASSET" | sha256sum -c -
        command -v gh >/dev/null || { echo "gh is missing" >&2; exit 1; }
        gh --version
        gh release verify "$BUILD_ID" --repo Ratio1/redmesh-vulndb
        gh release verify-asset "$BUILD_ID" "$RUNNER_TEMP/vulndb/$ASSET" --repo Ratio1/redmesh-vulndb
        # Cap output at size+1 bytes; the size and hash checks below catch truncation and excess.
        zstd -dc "$RUNNER_TEMP/vulndb/$ASSET" | head -c "$((SIZE + 1))" > "$RUNNER_TEMP/vulndb/vulndb.sqlite" || true
        python3 "${GITHUB_ACTION_PATH}/verify_vulndb.py" verify \
          extensions/business/cybersec/red_mesh/vulndb/pin.json "$RUNNER_TEMP/vulndb/vulndb.sqlite"
        cp "$RUNNER_TEMP/vulndb/vulndb.sqlite" extensions/business/cybersec/red_mesh/vulndb/vulndb.sqlite
        CHECKS
        then
          rm -f "$db"
          echo "::warning title=vulndb::vulndb fetch or verification failed (see the log above): this image uses the static CVE catalog"
        fi
